name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # سجل Git كامل — يلزم sitemap.ts لحساب lastmod من تاريخ آخر Commit لكل ملف

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          NEXT_PRIVATE_SKIP_TYPE_GENERATION: '1'

      - name: Add .nojekyll
        run: touch ./out/.nojekyll
      - name: ذاكرة IndexNow
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.sha }}
          restore-keys: indexnow-
      - name: IndexNow — تجهيز الروابط المتغيرة
        id: indexnow
        run: |
          node scripts/indexnow.mjs prepare
          { echo "urls<<EOF"; cat .indexnow/urls.txt; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # مسح كاش Cloudflare بعد كل نشر — وإلا تبقى الصفحات (خصوصاً الرئيسية) بنسخة قديمة.
      # curl وحده لا يفشل حتى لو رفضت Cloudflare الطلب، لذلك نتحقق من "success" ونطبع الخطأ بوضوح.
      - name: Purge Cloudflare Cache
        run: |
          RES=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/b528006a18f77a38dabf78eedd19c95f/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}' || true)
          echo "$RES"
          if echo "$RES" | grep -q '"success":[[:space:]]*true'; then
            echo "✅ تم مسح كاش Cloudflare"
          else
            echo "::error title=فشل مسح كاش Cloudflare::تحقق من صلاحية السر CF_API_TOKEN (Zone > Cache Purge). الموقع قد يعرض نسخة قديمة."
            exit 1
          fi

  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: إرسال IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          mkdir -p .indexnow
          printf '%s\n' "$URLS" > .indexnow/urls.txt
          node scripts/indexnow.mjs submit
